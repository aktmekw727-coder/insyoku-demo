name: Finalize Jinriki demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-jinriki.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode images, clean temp files, and fix script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images

          decode_image() {
            src="$1"
            dst="$2"
            base64 --ignore-garbage -d "$src" > "$dst"
            test -s "$dst"
            file "$dst" | grep -q 'JPEG image data'
          }

          decode_image assets/images/_hero.tmp.b64 assets/images/hero-yakiniku.jpg
          decode_image assets/images/_jinriki-sign.tmp.b64 assets/images/jinriki-sign.jpg
          decode_image assets/images/_tokusen-karubi.tmp.b64 assets/images/tokusen-karubi.jpg
          decode_image assets/images/_tongue.tmp.b64 assets/images/tongue.jpg
          decode_image assets/images/_harami.tmp.b64 assets/images/harami.jpg
          decode_image assets/images/_family-set.tmp.b64 assets/images/family-set.jpg
          decode_image assets/images/_bara-don.tmp.b64 assets/images/bara-don.jpg
          decode_image assets/images/_ippin.tmp.b64 assets/images/ippin.jpg
          decode_image assets/images/_kids-menu.tmp.b64 assets/images/kids-menu.jpg
          decode_image assets/images/_interior.tmp.b64 assets/images/interior.jpg

          rm -f assets/images/_*.tmp.b64
          rm -f assets/images/karubi2.jpg
          rm -f assets/images/*.b64.txt assets/images/*.base64
          rm -f assets/images_bundle.zip

          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          target = '  { name: "黒豚バラ焼", price: "¥830", desc: "鹿屋の黒豚を炭火で香ばしく", image: "kurobuta" },\n'
          s = s.replace(target, '')
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/finalize-jinriki.yml

      - name: Commit finalized demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize Jinriki demo assets'
          git push
