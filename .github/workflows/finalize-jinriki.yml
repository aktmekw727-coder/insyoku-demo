name: Finalize Jinriki demo

on:
  push:
    branches: [main]
    paths:
      - 'assets/images_bundle.zip'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install images and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          unzip -o assets/images_bundle.zip -d assets/images
          rm -f assets/images_bundle.zip
          rm -f assets/images/karubi2.jpg
          rm -f assets/images/*.b64.txt assets/images/*.base64
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          target = '  { name: "黒豚バラ焼", price: "¥830", desc: "鹿屋の黒豚を炭火で香ばしく", image: "kurobuta" },\n'
          if target in s:
              s = s.replace(target, '')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-jinriki.yml
      - name: Commit finalized demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize Jinriki demo assets'
          git push
