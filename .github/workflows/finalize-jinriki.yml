name: Finalize Jinriki demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-jinriki.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          images = {
              '_hero.tmp.b64': 'hero-yakiniku.jpg',
              '_jinriki-sign.tmp.b64': 'jinriki-sign.jpg',
              '_tokusen-karubi.tmp.b64': 'tokusen-karubi.jpg',
              '_tongue.tmp.b64': 'tongue.jpg',
              '_harami.tmp.b64': 'harami.jpg',
              '_family-set.tmp.b64': 'family-set.jpg',
              '_bara-don.tmp.b64': 'bara-don.jpg',
              '_ippin.tmp.b64': 'ippin.jpg',
              '_kids-menu.tmp.b64': 'kids-menu.jpg',
              '_interior.tmp.b64': 'interior.jpg',
          }
          root = Path('assets/images')
          for src_name, dst_name in images.items():
              raw = (root / src_name).read_text(encoding='ascii').strip()
              data = base64.b64decode(raw, validate=True)
              if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                  raise RuntimeError(f'{src_name} did not decode to a complete JPEG')
              (root / dst_name).write_bytes(data)
              print(f'{dst_name}: {len(data)} bytes')
          PY

      - name: Clean temporary files and fix script
        shell: bash
        run: |
          set -euo pipefail
          rm -f assets/images/_*.tmp.b64
          rm -f assets/images/karubi2.jpg
          rm -f assets/images/*.b64.txt assets/images/*.base64
          rm -f assets/images_bundle.zip

          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          target = '  { name: "黒豚バラ焼", price: "¥830", desc: "鹿屋の黒豚を炭火で香ばしく", image: "kurobuta" },\n'
          s = s.replace(target, '')
          if 'image: "kurobuta"' in s:
              raise RuntimeError('kurobuta image reference still exists')
          p.write_text(s, encoding='utf-8')
          PY

          rm -f .github/workflows/finalize-jinriki.yml

      - name: Commit finalized demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize Jinriki demo assets'
          git push
