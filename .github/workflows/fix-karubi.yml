name: Fix karubi image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-karubi.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode karubi image if stored as base64 text
        shell: bash
        run: |
          set -euo pipefail
          src='assets/images/karubi.jpg'
          file "$src"
          if file "$src" | grep -q 'ASCII text'; then
            tr -d '\r\n ' < "$src" | base64 -d > /tmp/karubi.jpg
            file /tmp/karubi.jpg
            file /tmp/karubi.jpg | grep -q 'JPEG image data'
            test -s /tmp/karubi.jpg
            mv /tmp/karubi.jpg "$src"
          fi
          file "$src" | grep -q 'JPEG image data'
      - name: Commit repaired image and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-karubi.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair karubi image encoding'
          git push
